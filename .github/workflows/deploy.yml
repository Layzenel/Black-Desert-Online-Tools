name: Black Desert Online Tools

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Версия вшивается в сайт и лежит в version.txt: открытая страница раз в полчаса сравнивает их
      # и предлагает обновиться (shared/src/webMain/.../update)
      - name: Build with Gradle (Wasm)
        run: |
          ./gradlew wasmJsBrowserDistribution -PwebVersion=1.0.${{ github.run_number }}
          echo "1.0.${{ github.run_number }}" > webApp/build/dist/wasmJs/productionExecutable/version.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  # 👇 ВАЖНО: deploy job должен быть отдельным и иметь environment
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
